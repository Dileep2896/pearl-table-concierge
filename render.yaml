# Render Blueprint. In Render: New → Blueprint, point it at this repo, then set the two secret keys.
# Or create a Web Service manually with the same Build Command, Start Command and env vars below.
services:
  - type: web
    name: tavola-table-concierge
    runtime: node
    plan: free
    # --include=dev keeps vite (build) available even though Render sets NODE_ENV=production; tsx is a runtime dep.
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      # Render injects PORT and the app binds 0.0.0.0 automatically; these are belt-and-suspenders.
      - key: NODE_VERSION
        value: 22.12.0
      - key: TAVOLA_DEMO_HOST
        value: 0.0.0.0
      # No local browser on Render: bookings run on Browserbase (auto) or in the diner's browser (handoff).
      - key: PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD
        value: "1"
      # Set these two in the Render dashboard (they are secret and not stored in the repo).
      # With a Browserbase key, booking mode defaults to auto (cloud browser); without it, handoff.
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: BROWSERBASE_API_KEY
        sync: false
